name: release

# Builds the release files from a clean checkout and attests them. It never publishes a release: it uploads the
# files as workflow artifacts; a maintainer downloads them, checks them and attaches them to a release.
# The build is reproducible: the exact SDK comes from global.json, the native bridge is the committed
# src/TabForge.AudioEngine/native/tfvst3.dll (built by the build-bridge workflow, verified against
# native/BUILD_PROVENANCE.md), so a local run of tools/Package-Release.ps1 on the same commit gives the same TabForge.exe and
# portable zip contents (tools/Compare-Release.ps1 checks; see docs/guides/REPRODUCIBLE_BUILDS.md).
on:
  push:
    tags: ['v*']
    branches: ['ci/087']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release-build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # sign the attestation with the workflow's identity (no personal certificate involved)
      attestations: write
    env:
      # A clean checkout has none of the copyrighted sample songs; checks that need them skip (and are reported).
      TABFORGE_NO_LOCAL_SONGS: '1'
    steps:
      # Do not clobber a release that was created by hand: if it already exists with assets, skip everything below.
      - name: Skip when the release already has assets
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $skip = 'false'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $json = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) {
              $n = @(($json | ConvertFrom-Json).assets).Count
              if ($n -gt 0) { $skip = 'true'; Write-Output "Release $env:TAG already exists with $n asset(s); skipping the build." }
            }
          }
          $global:LASTEXITCODE = 0
          "skip=$skip" | Add-Content -Path $env:GITHUB_OUTPUT

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: steps.guard.outputs.skip != 'true'
        with:
          global-json-file: global.json

      - name: Check the tag against the project version
        if: steps.guard.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $version = ([xml][IO.File]::ReadAllText('Directory.Build.props')).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "Directory.Build.props version: $version; tag: $env:GITHUB_REF_NAME"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version"; exit 1 }

      # The bridge is NOT rebuilt here: the release ships the committed DLL, so local and CI builds carry the same
      # bridge. Package-Release.ps1 refuses to package if its SHA-256 differs from native/BUILD_PROVENANCE.md.
      - name: Show the committed bridge and the SDK in use
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet --version
          Get-Content native/BUILD_PROVENANCE.md
          (Get-FileHash -Algorithm SHA256 src/TabForge.AudioEngine/native/tfvst3.dll).Hash.ToLowerInvariant()

      - name: Restore (locked mode)
        if: steps.guard.outputs.skip != 'true'
        run: dotnet restore TabForge.sln --locked-mode

      # Inno Setup is preinstalled on the Windows runner image; if it is missing, a pinned version is installed.
      - name: Find or install Inno Setup
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error 'Inno Setup compiler not found'; exit 1 }
          "Inno Setup: $iscc"
          "ISCC=$iscc" | Add-Content -Path $env:GITHUB_ENV

      # The release gate is part of this step: Package-Release.ps1 runs the release gate (never packaged) and requires
      # "--areas release" to report 0 failed, so a failing gate fails the workflow and nothing is attached. The packaged build is the normal one.
      # Runs on the clean checkout itself (no worktree needed) and refuses a dirty tree. Publishes, self-tests the exact publish folder (--require ci: gp-fixtures, synthetic-fixtures, source-hygiene,
      # installer-parity, fuzz), then builds the portable zip, the installer and the SHA-256 file in dist/.
      - name: Package (self-test, portable zip, installer, checksums)
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        timeout-minutes: 30
        run: ./tools/Package-Release.ps1 -InnoCompiler $env:ISCC

      - name: List the release files
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }

      - name: Attest build provenance
        if: steps.guard.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/TabForge-*-win-x64-portable.zip
            dist/TabForge-*-setup.exe
            dist/TabForge-*-SHA256.txt
            src/TabForge.AudioEngine/native/tfvst3.dll

      - name: Archive the exact reviewed source
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: git archive --format=zip --prefix=TabForge-0.8.7-source/ --output=dist/TabForge-0.8.7-source.zip HEAD

      - name: Upload the release files
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/TabForge-*-win-x64-portable.zip
            dist/TabForge-*-setup.exe
            dist/TabForge-*-SHA256.txt
            dist/TabForge-*-selftest.log
            dist/TabForge-*-releasegate.log
            dist/SoundTouch.Net-*-source.zip
            dist/TabForge-*-source.zip
            native/BUILD_PROVENANCE.md
          if-no-files-found: error

      # Symbols are not shipped; they are kept for symbolicating crash logs.
      - name: Upload symbols
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: symbols
          path: dist/symbols
          if-no-files-found: warn

      - name: Preserve gate logs even when packaging fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-failure-logs
          path: dist/*.log
          if-no-files-found: warn

  linux-release-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      WINE_TARBALL: https://github.com/Kron4ek/Wine-Builds/releases/download/9.21/wine-9.21-amd64-wow64.tar.xz
      WINE_TARBALL_SHA256: 020f8886750ff658d92ea39e696d2a57d3e8f056f00d8dfe45b65cddee5d6fa5
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      SOUNDFONT_URL: https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2
      SOUNDFONT_SHA256: 9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-03-12-50/ffmpeg-n8.1.3-32-g760d10603e-linux64-lgpl-8.1.tar.xz
      FFMPEG_SHA256: d4adbedd1c413acfb7bbe4c2c36fa89df3d70917c7883ea897fa8dc8b136090b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git python3 curl xz-utils binutils patchelf libasound2-dev libmp3lame0 libmpg123-0 libfuse2 libfreetype6 libfontconfig1 libgl1 libx11-6 libxext6 libxcursor1 libxrandr2
      - name: Fetch and verify pinned runtime inputs
        run: |
          mkdir -p staging/wine
          curl -fsSL --retry 3 -o staging/wine.tar.xz "$WINE_TARBALL"
          echo "$WINE_TARBALL_SHA256  staging/wine.tar.xz" | sha256sum -c -
          tar -xf staging/wine.tar.xz -C staging/wine --strip-components=1
          curl -fsSL --retry 3 -o staging/appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  staging/appimagetool" | sha256sum -c -
          chmod +x staging/appimagetool staging/wine/bin/wine staging/wine/bin/wineserver
          curl -fsSL --retry 3 -o staging/GeneralUser-GS.sf2 "$SOUNDFONT_URL"
          echo "$SOUNDFONT_SHA256  staging/GeneralUser-GS.sf2" | sha256sum -c -
          cp src/TabForge.Avalonia/licenses/GeneralUser-GS_LICENSE.txt staging/GeneralUser-GS-LICENSE.txt
          curl -fsSL --retry 3 -o staging/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  staging/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p staging/ffmpeg
          tar -xf staging/ffmpeg.tar.xz -C staging/ffmpeg --strip-components=1
          test -f staging/ffmpeg/LICENSE.txt
          staging/ffmpeg/bin/ffmpeg -version | tee staging/ffmpeg-version.txt
          if staging/ffmpeg/bin/ffmpeg -buildconf 2>&1 | grep -E -- '--enable-(gpl|nonfree)'; then
            echo 'Refusing a GPL/nonfree FFmpeg build'; exit 1
          fi
          printf 'Input: %s\nSHA-256: %s\n' "$FFMPEG_URL" "$FFMPEG_SHA256" > staging/ffmpeg/BUILD_PROVENANCE.txt
      - name: Build both experimental Linux packages
        env:
          TABFORGE_SOUNDFONT: ${{ github.workspace }}/staging/GeneralUser-GS.sf2
          TABFORGE_SOUNDFONT_LICENSE: ${{ github.workspace }}/staging/GeneralUser-GS-LICENSE.txt
        run: |
          bash tools/package-linux.sh --out "$GITHUB_WORKSPACE/package" --wine "$GITHUB_WORKSPACE/staging/wine" --helpers "$GITHUB_WORKSPACE/src/TabForge.AudioEngine/native" --appimagetool "$GITHUB_WORKSPACE/staging/appimagetool" --ffmpeg "$GITHUB_WORKSPACE/staging/ffmpeg"
          test -f package/linux/TabForge-0.8.7-linux-x64.tar.xz
          test -f package/linux/TabForge-0.8.7-x86_64.AppImage
      - name: Verify package parity and record checksums
        working-directory: package/linux
        run: |
          ./TabForge-0.8.7-x86_64.AppImage --appimage-extract >/dev/null
          diff -r squashfs-root/usr TabForge.AppDir/usr
          test -f TabForge.AppDir/usr/bin/wine/bin/wine
          cmp TabForge.AppDir/usr/bin/ffmpeg "$GITHUB_WORKSPACE/staging/ffmpeg/bin/ffmpeg"
          TabForge.AppDir/usr/bin/ffmpeg -version
          for file in tfvst32.exe tfvst64.exe tfvst3.dll tfvst3-x86.dll; do
            cmp "TabForge.AppDir/usr/bin/$file" "$GITHUB_WORKSPACE/src/TabForge.AudioEngine/native/$file"
          done
          sha256sum TabForge-0.8.7-linux-x64.tar.xz TabForge-0.8.7-x86_64.AppImage > TabForge-0.8.7-linux-SHA256.txt
      - name: Upload Linux review files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-release-files
          path: |
            package/linux/TabForge-*.tar.xz
            package/linux/TabForge-*.AppImage
            package/linux/TabForge-*-SHA256.txt
            package/linux/MIN_GLIBC.txt
          if-no-files-found: error
