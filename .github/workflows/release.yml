name: release

# Builds the release files from a clean checkout and attests them. It never publishes a release: it uploads the
# files as workflow artifacts; a maintainer downloads them, checks them and attaches them to a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release-build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # sign the attestation with the workflow's identity (no personal certificate involved)
      attestations: write
    env:
      # A clean checkout has none of the copyrighted sample songs; checks that need them skip (and are reported).
      TABFORGE_NO_LOCAL_SONGS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml][IO.File]::ReadAllText('Directory.Build.props')).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "Directory.Build.props version: $version; tag: $env:GITHUB_REF_NAME"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version"; exit 1 }

      # The bridge that ships is the one built here from the pinned, unpatched VST3 SDK. The script fetches and
      # verifies the SDK pin, builds tfvst3.dll, copies it over the checked-in file and rewrites
      # native/BUILD_PROVENANCE.md with this build's compiler and SHA-256 (which Package-Release.ps1 then verifies).
      - name: Build tfvst3.dll from the pinned SDK
        shell: pwsh
        run: |
          # A short build folder: the SDK's submodules contain very long paths.
          ./native/build-tfvst3.ps1 -NoTest -BuildDir C:\tfb
          if (-not $?) { exit 1 }
          Get-Content native/BUILD_PROVENANCE.md

      - name: Restore (locked mode)
        run: dotnet restore TabForge.sln --locked-mode

      # Inno Setup is preinstalled on the Windows runner image; if it is missing, a pinned version is installed.
      - name: Find or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error 'Inno Setup compiler not found'; exit 1 }
          "Inno Setup: $iscc"
          "ISCC=$iscc" | Add-Content -Path $env:GITHUB_ENV

      # Publishes, self-tests the exact publish folder (required areas: gp-fixtures, synthetic-fixtures, source-hygiene,
      # installer-parity), then builds the portable zip, the installer and the SHA-256 file in dist/.
      - name: Package (self-test, portable zip, installer, checksums)
        shell: pwsh
        timeout-minutes: 30
        run: ./tools/Package-Release.ps1 -InnoCompiler $env:ISCC

      - name: List the release files
        shell: pwsh
        run: Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/TabForge-*-win-x64-portable.zip
            dist/TabForge-*-setup.exe
            dist/TabForge-*-SHA256.txt
            src/TabForge.AudioEngine/native/tfvst3.dll

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/TabForge-*-win-x64-portable.zip
            dist/TabForge-*-setup.exe
            dist/TabForge-*-SHA256.txt
            dist/TabForge-*-selftest.log
            dist/SoundTouch.Net-*-source.zip
            native/BUILD_PROVENANCE.md
          if-no-files-found: error

      # Symbols are not shipped; they are kept for symbolicating crash logs.
      - name: Upload symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: symbols
          path: dist/symbols
          if-no-files-found: warn
