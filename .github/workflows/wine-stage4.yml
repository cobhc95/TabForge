name: wine-stage4
# Stage 4: Windows VST3 in the helper. The real .NET engine starts tfvst64.exe / tfvst32.exe under Wine over TCP + the
# explicit file block; the helpers load tfvst3.dll / tfvst3-x86.dll and host the real fixtures. Both fixtures are free
# maker releases downloaded here and SHA-256-pinned, never committed: Dexed 1.1.0 (64-bit VST3 instrument bundle) and
# TDR Nova 2.2.3 (32-bit and 64-bit VST3 effect files).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TABFORGE_WINE: ${{ github.workspace }}/wine/bin/wine
  TABFORGE_TFVST32_EXE: ${{ github.workspace }}/src/TabForge.AudioEngine/native/tfvst32.exe
  TABFORGE_TFVST64_EXE: ${{ github.workspace }}/src/TabForge.AudioEngine/native/tfvst64.exe
  TABFORGE_WINE_REAL_VST3: ${{ github.workspace }}/vst3-fixtures/Dexed.vst3
  TABFORGE_WINE_REAL_VST3_32: ${{ github.workspace }}/vst3-fixtures/TDRNova32.vst3
  TABFORGE_WINE_REAL_VST3_64: ${{ github.workspace }}/vst3-fixtures/TDRNova64.vst3
  TABFORGE_WINE_METRICS: ${{ github.workspace }}/wine-stage4-metrics.txt
jobs:
  wine-stage4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Install display and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip libfreetype6 libfontconfig1
      - name: Fetch pinned Wow64 Wine (spike only, not for release)
        run: |
          curl -fsSL -o wine.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/9.21/wine-9.21-amd64-wow64.tar.xz
          echo "020f8886750ff658d92ea39e696d2a57d3e8f056f00d8dfe45b65cddee5d6fa5  wine.tar.xz" | sha256sum -c -
          mkdir wine && tar -xf wine.tar.xz -C wine --strip-components=1
          chmod +x wine/bin/wine wine/bin/wineserver
      - name: Fetch the pinned real VST3 fixtures from the makers' official releases
        run: |
          mkdir -p vst3-fixtures
          curl -fsSL -o dexed-win.zip https://github.com/asb2m10/dexed/releases/download/v1.1.0/Dexed-1.1.0-win.zip
          echo "4773150a3dfa281d1caef583f493a41ed99ea95b054b5a3479780799ed6279cc  dexed-win.zip" | sha256sum -c -
          unzip -p dexed-win.zip "Dexed.vst3/Contents/x86_64-win/Dexed.vst3" > vst3-fixtures/Dexed.vst3.bin
          mkdir -p vst3-fixtures/Dexed.vst3/Contents/x86_64-win vst3-fixtures/Dexed.vst3/Contents/Resources
          mv vst3-fixtures/Dexed.vst3.bin vst3-fixtures/Dexed.vst3/Contents/x86_64-win/Dexed.vst3
          unzip -p dexed-win.zip "Dexed.vst3/Contents/Resources/moduleinfo.json" > vst3-fixtures/Dexed.vst3/Contents/Resources/moduleinfo.json

          curl -fsSL -o nova.zip "https://www.tokyodawn.net/labs/Nova/2.2.3/TDR%20Nova%20(no%20installer).zip"
          echo "9bb52d042bd95dd85456da66316347a00d865d9d3f6652333e1a2bc195cb8907  nova.zip" | sha256sum -c -
          unzip -p nova.zip "TDR Nova (no installer)/VST3/Win32/TDR Nova.vst3" > vst3-fixtures/TDRNova32.vst3
          unzip -p nova.zip "TDR Nova (no installer)/VST3/x64/TDR Nova.vst3" > vst3-fixtures/TDRNova64.vst3
          echo "b306439ad6385d9b27d737b37a7101724fdc1000cf5a8c781bfdb38d0cbe5a06  $TABFORGE_WINE_REAL_VST3/Contents/x86_64-win/Dexed.vst3" | sha256sum -c -
          echo "5813aebb6532fc2586a8a1c61769572a1f5f19be44d66441bc025c7327a069c4  $TABFORGE_WINE_REAL_VST3_32" | sha256sum -c -
          echo "a9bd0fbfb93137576ddd192e683285d9e410169eb6890cf07e6440e1e2211325  $TABFORGE_WINE_REAL_VST3_64" | sha256sum -c -
          file vst3-fixtures/Dexed.vst3/Contents/x86_64-win/Dexed.vst3 vst3-fixtures/TDRNova32.vst3 vst3-fixtures/TDRNova64.vst3
          test -f src/TabForge.AudioEngine/native/tfvst3.dll
          test -f src/TabForge.AudioEngine/native/tfvst3-x86.dll
      - name: Engine + both helpers host the VST3 fixtures under Wine (Xvfb), measured
        run: |
          xvfb-run -a dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj \
            -c Release \
            -p:RestoreLockedMode=false \
            --filter "FullyQualifiedName~Vst3Wine" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=wine-stage4.trx" \
            --results-directory "${{ github.workspace }}/wine-stage4-results"
      - name: Show the recorded metrics
        if: always()
        run: |
          if [ -f "$TABFORGE_WINE_METRICS" ]; then cat "$TABFORGE_WINE_METRICS"; else echo "no metrics file"; fi
      - name: Upload metrics and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-stage4-evidence
          path: |
            wine-stage4-metrics.txt
            wine-stage4-results/**
          if-no-files-found: warn
