# Linux package + smoke test (informational, not a release gate): builds the COMPLETE self-contained linux-x64 package with tools/package-linux.sh
# (app, libtfportable.so, libtfvst3.so, LAME, the pinned LGPL ffmpeg, the pinned GeneralUser GS SoundFont with its licence, MIN_GLIBC.txt), repacks it as
# one tar.gz with the top folder TabForge/, runs the package on a virtual screen (Xvfb) with a virtual sound server, takes screenshots through the app's
# own capture mode, runs the self-tests, and uploads the tarball (TabForge-linux-x64) and the screenshots/logs (linux-smoke) as artifacts.
# Third-party downloads are pinned to an immutable URL and verified by sha256; a mismatch stops the job.
name: linux-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/tfportable/**'
      - 'native/tfvst3/**'
      - 'tools/package-linux.sh'
      - 'tools/capture/linux-smoke.json'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/linux-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04   # old on purpose: the package is built and smoke-tested on glibc 2.35 (Ubuntu 22.04, Zorin 17), so it runs on that and anything newer
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TABFORGE_NO_LOCAL_SONGS: '1'
      # ffmpeg: BtbN/FFmpeg-Builds dated release (immutable; 'latest' moves), LGPL build, checksum as published in that release's checksums.sha256.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-27-18-38/ffmpeg-n8.1.3-24-g92611900bb-linux64-lgpl-8.1.tar.xz
      FFMPEG_SHA256: 75734a2604fbbf653256ac9d29bf88499d217b0c5c6d7c4a2a1f7b1f93073b55
      # GeneralUser GS v2.0.3: pinned to the commit that carries it (the repository publishes no release assets or tags).
      SOUNDFONT_URL: https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/97049183643d5fc5a9322a69c5b09efb667c6c3a/GeneralUser-GS.sf2
      SOUNDFONT_SHA256: 9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe
      SOUNDFONT_LICENSE_URL: https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/97049183643d5fc5a9322a69c5b09efb667c6c3a/documentation/LICENSE.txt
      SOUNDFONT_LICENSE_SHA256: 7b32efefdf95ce38a043799f0659853ddc00fbaa14d8c50f0aca16b9b8b405be
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      # No system ffmpeg here on purpose: the run below must use the ffmpeg shipped in the package. libmp3lame0 is copied into the package by the script.
      - name: Install the build, display, sound and font packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth x11-utils imagemagick pulseaudio libasound2-dev libasound2-plugins             libmp3lame0 libmpg123-0 patchelf fonts-dejavu-core fonts-liberation libfontconfig1 libice6 libsm6 cmake git binutils python3 xz-utils

      - name: Fetch ffmpeg (LGPL build) and the GeneralUser GS SoundFont, verify sha256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/third/ffmpeg" "$RUNNER_TEMP/third/soundfont"
          fetch() { # url sha256 file
            curl -fsSL --retry 4 --retry-delay 5 -o "$3" "$1"
            actual="$(sha256sum "$3" | cut -d' ' -f1)"
            if [ "$actual" != "$2" ]; then echo "::error::sha256 mismatch for $1 (expected $2, got $actual)"; exit 1; fi
            echo "verified $3"
          }
          fetch "$FFMPEG_URL" "$FFMPEG_SHA256" "$RUNNER_TEMP/third/ffmpeg.tar.xz"
          fetch "$SOUNDFONT_URL" "$SOUNDFONT_SHA256" "$RUNNER_TEMP/third/soundfont/GeneralUser-GS.sf2"
          fetch "$SOUNDFONT_LICENSE_URL" "$SOUNDFONT_LICENSE_SHA256" "$RUNNER_TEMP/third/soundfont/GeneralUser-GS-LICENSE.txt"
          tar -xJf "$RUNNER_TEMP/third/ffmpeg.tar.xz" -C "$RUNNER_TEMP/third/ffmpeg" --strip-components=1
          test -x "$RUNNER_TEMP/third/ffmpeg/bin/ffmpeg" && test -f "$RUNNER_TEMP/third/ffmpeg/LICENSE.txt"
          "$RUNNER_TEMP/third/ffmpeg/bin/ffmpeg" -version | head -2

      - name: Build the package (app, libtfportable.so, libtfvst3.so, ffmpeg, SoundFont)
        run: |
          chmod +x tools/package-linux.sh
          TABFORGE_SOUNDFONT="$RUNNER_TEMP/third/soundfont/GeneralUser-GS.sf2"           TABFORGE_SOUNDFONT_LICENSE="$RUNNER_TEMP/third/soundfont/GeneralUser-GS-LICENSE.txt"             tools/package-linux.sh --out "$RUNNER_TEMP/pkg" --ffmpeg "$RUNNER_TEMP/third/ffmpeg"

      - name: Repack as one tar.gz (top folder TabForge/) and check its contents
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pkg/linux"
          rm -rf "$RUNNER_TEMP/stage"; mkdir -p "$RUNNER_TEMP/stage" dist
          cp -a "$OUT/TabForge.AppDir/usr/bin" "$RUNNER_TEMP/stage/TabForge"
          cp "$OUT/MIN_GLIBC.txt" "$RUNNER_TEMP/stage/TabForge/MIN_GLIBC.txt"
          for f in TabForge libtfportable.so libtfvst3.so ffmpeg ThirdParty/ffmpeg/LICENSE.txt ThirdParty/ffmpeg/README.txt                    SoundFonts/GeneralUser-GS.sf2 SoundFonts/GeneralUser-GS-LICENSE.txt MIN_GLIBC.txt; do
            test -s "$RUNNER_TEMP/stage/TabForge/$f" || { echo "::error::package is missing $f"; exit 1; }
          done
          tar -czf dist/TabForge-linux-x64.tar.gz -C "$RUNNER_TEMP/stage" TabForge
          ls -la dist; echo "minimum glibc: $(cat "$OUT/MIN_GLIBC.txt")"
          MAXG=2.35   # Ubuntu 22.04 / Zorin 17; raise it only on purpose
          NEED="$(cat "$OUT/MIN_GLIBC.txt")"
          [ "$(printf '%s\n%s\n' "$NEED" "$MAXG" | sort -V | tail -n1)" = "$MAXG" ] || { echo "::error::the package needs glibc $NEED, newer than the allowed $MAXG"; exit 1; }
          tar -tzf dist/TabForge-linux-x64.tar.gz > "$RUNNER_TEMP/tar-list.txt"   # not piped into head: under pipefail head closing early makes tar fail
          head -60 "$RUNNER_TEMP/tar-list.txt"

      - name: Unpack the tarball as a user would, add the demo song
        run: |
          mkdir -p publish
          tar -xzf dist/TabForge-linux-x64.tar.gz -C publish
          mkdir -p publish/TabForge/Samples
          cp samples/*.gp publish/TabForge/Samples/
          ls -la publish/TabForge | head -40

      - name: Start a virtual sound server
        continue-on-error: true
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=smoke
          pactl set-default-sink smoke
          pactl info | head -20

      - name: Self-tests (basic set) on a virtual screen
        id: selftest
        continue-on-error: true
        working-directory: publish/TabForge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/smoke"
          timeout 900 xvfb-run -a -s "-screen 0 1600x1000x24" ./TabForge --selftest "$GITHUB_WORKSPACE/smoke/selftest.log" ; echo "exit $?" | tee "$GITHUB_WORKSPACE/smoke/selftest-exit.txt"
          grep -E '^TabForge self-test|^\s+FAIL' "$GITHUB_WORKSPACE/smoke/selftest.log" | head -80 || true

      - name: Screenshots through capture mode
        id: capture
        continue-on-error: true
        working-directory: publish/TabForge
        run: |
          timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" ./TabForge --capture "$GITHUB_WORKSPACE/tools/capture/linux-smoke.json" --out "$GITHUB_WORKSPACE/smoke" > "$GITHUB_WORKSPACE/smoke/capture.log" 2>&1; echo "exit $?" | tee "$GITHUB_WORKSPACE/smoke/capture-exit.txt"
          tail -40 "$GITHUB_WORKSPACE/smoke/capture.log"
          find "$GITHUB_WORKSPACE/smoke" -name '*.png' | head -40

      - name: Plain start with the demo song (20 s) and a whole-screen shot
        continue-on-error: true
        working-directory: publish/TabForge
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          ./TabForge "Samples/TabForge Demo - Ashen Meridian.gp" > "$GITHUB_WORKSPACE/smoke/plain-start.log" 2>&1 &
          APP=$!
          sleep 20
          import -window root "$GITHUB_WORKSPACE/smoke/plain-start-screen.png" || xwd -root -silent | convert xwd:- "$GITHUB_WORKSPACE/smoke/plain-start-screen.png"
          if kill -0 $APP 2>/dev/null; then echo "still running after 20 s" | tee -a "$GITHUB_WORKSPACE/smoke/plain-start.log"; kill $APP; else echo "exited early" | tee -a "$GITHUB_WORKSPACE/smoke/plain-start.log"; fi
          tail -40 "$GITHUB_WORKSPACE/smoke/plain-start.log"

      - name: Collect the app's own logs
        if: always()
        run: |
          mkdir -p smoke/app-logs
          for d in "$HOME/.local/share/TabForge" "$HOME/.config/TabForge" "$HOME/.cache/TabForge"; do
            [ -d "$d" ] && find "$d" -name '*.log' -exec cp --parents {} smoke/app-logs/ \; || true
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-smoke
          path: smoke
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TabForge-linux-x64
          path: dist/TabForge-linux-x64.tar.gz
          retention-days: 14
          compression-level: 0
