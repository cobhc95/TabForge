# Linux smoke test (informational, not a release gate): builds the linux-x64 app with its native audio/MIDI library, starts it on a
# virtual screen (Xvfb) with a virtual sound server, takes screenshots through the app's own capture mode, runs the self-tests, and
# uploads the app folder, the screenshots and the logs as one artifact.
name: linux-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/tfportable/**'
      - 'tools/capture/linux-smoke.json'
      - '.github/workflows/linux-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TABFORGE_NO_LOCAL_SONGS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Install the display, sound and font packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth x11-utils imagemagick pulseaudio libasound2-dev libasound2-plugins \
            libmp3lame0 ffmpeg fonts-dejavu-core fonts-liberation libfontconfig1 libice6 libsm6 cmake

      - name: Build libtfportable (miniaudio + RtMidi)
        run: |
          cmake -S native/tfportable -B build/tfportable -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tfportable --config Release

      - name: Publish the app (linux-x64)
        run: >
          dotnet publish src/TabForge.Avalonia/TabForge.Avalonia.csproj -c Release -r linux-x64 --self-contained true
          -p:EnableWindowsTargeting=true -p:RestoreLockedMode=false -p:PublishReadyToRun=false -o publish/TabForge

      - name: Put the native library and the demo song beside the app
        run: |
          cp build/tfportable/libtfportable.* publish/TabForge/
          mkdir -p publish/TabForge/Samples
          cp samples/*.gp publish/TabForge/Samples/
          ls -la publish/TabForge | head -40

      - name: Start a virtual sound server
        continue-on-error: true
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=smoke
          pactl set-default-sink smoke
          pactl info | head -20

      - name: Self-tests (basic set) on a virtual screen
        id: selftest
        continue-on-error: true
        working-directory: publish/TabForge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/smoke"
          timeout 900 xvfb-run -a -s "-screen 0 1600x1000x24" ./TabForge --selftest "$GITHUB_WORKSPACE/smoke/selftest.log" ; echo "exit $?" | tee "$GITHUB_WORKSPACE/smoke/selftest-exit.txt"
          grep -E '^TabForge self-test|^\s+FAIL' "$GITHUB_WORKSPACE/smoke/selftest.log" | head -80 || true

      - name: Screenshots through capture mode
        id: capture
        continue-on-error: true
        working-directory: publish/TabForge
        run: |
          timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" ./TabForge --capture "$GITHUB_WORKSPACE/tools/capture/linux-smoke.json" --out "$GITHUB_WORKSPACE/smoke" > "$GITHUB_WORKSPACE/smoke/capture.log" 2>&1; echo "exit $?" | tee "$GITHUB_WORKSPACE/smoke/capture-exit.txt"
          tail -40 "$GITHUB_WORKSPACE/smoke/capture.log"
          find "$GITHUB_WORKSPACE/smoke" -name '*.png' | head -40

      - name: Plain start with the demo song (20 s) and a whole-screen shot
        continue-on-error: true
        working-directory: publish/TabForge
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          ./TabForge "Samples/TabForge Demo - Ashen Meridian.gp" > "$GITHUB_WORKSPACE/smoke/plain-start.log" 2>&1 &
          APP=$!
          sleep 20
          import -window root "$GITHUB_WORKSPACE/smoke/plain-start-screen.png" || xwd -root -silent | convert xwd:- "$GITHUB_WORKSPACE/smoke/plain-start-screen.png"
          if kill -0 $APP 2>/dev/null; then echo "still running after 20 s" | tee -a "$GITHUB_WORKSPACE/smoke/plain-start.log"; kill $APP; else echo "exited early" | tee -a "$GITHUB_WORKSPACE/smoke/plain-start.log"; fi
          tail -40 "$GITHUB_WORKSPACE/smoke/plain-start.log"

      - name: Collect the app's own logs
        if: always()
        run: |
          mkdir -p smoke/app-logs
          for d in "$HOME/.local/share/TabForge" "$HOME/.config/TabForge" "$HOME/.cache/TabForge"; do
            [ -d "$d" ] && find "$d" -name '*.log' -exec cp --parents {} smoke/app-logs/ \; || true
          done
          tar -czf smoke/TabForge-linux-x64.tar.gz -C publish TabForge

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-smoke
          path: smoke
          retention-days: 14
