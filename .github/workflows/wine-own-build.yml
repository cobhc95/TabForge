name: wine-own-build
# Stage 18 release readiness: attempt one build of Wine from the pinned source tarball on Ubuntu 22.04 (the package's
# glibc floor). This is a build-attempt gate only: it does not change the package, which still uses the Kron4ek prebuilt
# until an own build is proven end to end. Dispatch-only now that the registration push has run and failed before any
# build step (run 41313237029); per the brief it was not retried.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  own-wine:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Wine build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential mingw-w64 flex bison gettext autoconf libtool pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev \
            libxcursor-dev libxcomposite-dev libxinerama-dev libxdamage-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev libxml2-dev libxslt1-dev \
            libpng-dev libjpeg-dev libtiff-dev libmpg123-dev libgnutls28-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libosmesa6-dev \
            libv4l-dev liblcms2-dev libkrb5-dev libcapi20-dev libsane-dev libgphoto2-dev \
            libpcap-dev libpcsclite-dev xvfb xz-utils

      - name: Build Wine from the pinned source
        shell: bash
        run: tools/build-wine.sh --stage "$RUNNER_TEMP/wine-own"

      - name: Upload the build record
        uses: actions/upload-artifact@v4
        with:
          name: wine-own-build-provenance
          path: |
            ${{ runner.temp }}/wine-own/BUILD_PROVENANCE.md
            ${{ runner.temp }}/wine-own/wine-version.txt
            ${{ runner.temp }}/wine-own/configure.log
          if-no-files-found: error
          retention-days: 14
