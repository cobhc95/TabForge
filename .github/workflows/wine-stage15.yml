name: wine-stage15
# Stage 15: fault injection and the all-core load gate. Windows runs the named-pipe/TCP fault cases and the Windows
# load table; Linux runs the same portable faults against a real tiny full volume, the Wine faults, and the Wine load
# table. The 60-minute soak is a separate workflow (`wine-stage15-soak.yml`) so its run id can be reported without
# holding the gate open. This workflow is dispatch-only: it starts dozens of real helper processes.
on:
  workflow_dispatch:
  # Temporary registration trigger (Stage 14 did the same): a workflow that only exists on wine-bridge is not
  # dispatchable until GitHub has seen it on a push. Removed once the gate and soak runs are recorded.
  push:
    branches: [wine-bridge]
    paths:
      - '.github/workflows/wine-stage15.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  WINE_TARBALL: https://github.com/Kron4ek/Wine-Builds/releases/download/9.21/wine-9.21-amd64-wow64.tar.xz
  WINE_TARBALL_SHA256: 020f8886750ff658d92ea39e696d2a57d3e8f056f00d8dfe45b65cddee5d6fa5

jobs:
  windows-faults-load:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Build the x86 and x64 helpers and test plug-ins
        shell: pwsh
        run: |
          cmake -S native/tfvst32 -B build/win32 -G "Visual Studio 17 2022" -A Win32 -DTFVST32_BUILD_TEST=ON
          cmake --build build/win32 --config Release --parallel
          cmake -S native/tfvst32 -B build/win64 -G "Visual Studio 17 2022" -A x64 -DTFVST32_BUILD_TEST=ON
          cmake --build build/win64 --config Release --parallel

      # A real full volume, capped at 8 MiB: the tests refuse anything larger, so this can never touch the runner's disk.
      - name: Create the small full-disk test volume
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'stage15.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'stage15-diskpart.txt'
          @"
          create vdisk file="$vhd" maximum=8 type=fixed
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=TFSTAGE15
          assign letter=Z
          "@ | Set-Content -Path $script -Encoding ASCII
          diskpart /s $script
          if (-not (Test-Path 'Z:\')) { throw 'the 8 MiB test volume did not mount' }
          "TABFORGE_TEST_FULL_DISK=Z:\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Faults (engine death, uncreatable block, full block/log volume, unwritable log)
        shell: pwsh
        env:
          TABFORGE_TFVST32_EXE: ${{ github.workspace }}\build\win32\Release\tfvst32.exe
          TABFORGE_TFVST64_EXE: ${{ github.workspace }}\build\win64\Release\tfvst64.exe
          TABFORGE_TFVST32_TEST_DLL: ${{ github.workspace }}\build\win32\Release\passthrough32.dll
          TABFORGE_TFVST64_TEST_DLL: ${{ github.workspace }}\build\win64\Release\passthrough64.dll
        run: >
          dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release -p:RestoreLockedMode=false
          --filter "FullyQualifiedName~Stage15FaultTests"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=stage15-faults-windows.trx"
          --results-directory "${{ github.workspace }}\stage15-results"

      - name: Load, all logical processors, chains of eight mixed 32/64-bit plug-ins
        shell: pwsh
        env:
          TABFORGE_TFVST32_EXE: ${{ github.workspace }}\build\win32\Release\tfvst32.exe
          TABFORGE_TFVST64_EXE: ${{ github.workspace }}\build\win64\Release\tfvst64.exe
          TABFORGE_TFVST32_TEST_DLL: ${{ github.workspace }}\build\win32\Release\passthrough32.dll
          TABFORGE_TFVST64_TEST_DLL: ${{ github.workspace }}\build\win64\Release\passthrough64.dll
          TABFORGE_STRESS: '1'
          TABFORGE_LOAD_WARM_SECONDS: '2'
          TABFORGE_LOAD_SECONDS: '8'
          TABFORGE_LOAD_OUT: ${{ github.workspace }}\stage15-load-windows.csv
        run: >
          dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release -p:RestoreLockedMode=false
          --filter "FullyQualifiedName~Stage15StressTests.AllCore"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=stage15-load-windows.trx"
          --results-directory "${{ github.workspace }}\stage15-results"

      # Diagnostic only, not a gate: the same chain with each link's own 75 % wait instead of the callback-wide
      # deadline. If the chain then fits its blocks, the shared deadline was cutting work that would have finished;
      # if it still misses or runs late, the helper round trips themselves are the limit.
      - name: Load diagnostic, per-link budget (reported, not a gate)
        shell: pwsh
        env:
          TABFORGE_TFVST32_EXE: ${{ github.workspace }}\build\win32\Release\tfvst32.exe
          TABFORGE_TFVST64_EXE: ${{ github.workspace }}\build\win64\Release\tfvst64.exe
          TABFORGE_TFVST32_TEST_DLL: ${{ github.workspace }}\build\win32\Release\passthrough32.dll
          TABFORGE_TFVST64_TEST_DLL: ${{ github.workspace }}\build\win64\Release\passthrough64.dll
          TABFORGE_STRESS: '1'
          TABFORGE_LOAD_UNSHARED: '1'
          TABFORGE_LOAD_WARM_SECONDS: '2'
          TABFORGE_LOAD_SECONDS: '8'
          TABFORGE_LOAD_SIZES: '256,512,1024'
          TABFORGE_LOAD_OUT: ${{ github.workspace }}\stage15-load-windows-unshared.csv
        run: >
          dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release -p:RestoreLockedMode=false
          --filter "FullyQualifiedName~Stage15StressTests.AllCore"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=stage15-load-windows-unshared.trx"
          --results-directory "${{ github.workspace }}\stage15-results"

      - name: Detach and delete the small test volume
        if: always()
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'stage15.vhdx'
          if (Test-Path $vhd) {
            $script = Join-Path $env:RUNNER_TEMP 'stage15-detach.txt'
            Set-Content -Path $script -Encoding ASCII -Value @(
              "select vdisk file=`"$vhd`""
              "detach vdisk"
            )
            diskpart /s $script
            Remove-Item $vhd -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows logs and data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage15-windows-evidence
          path: |
            stage15-load-windows.csv
            stage15-load-windows-unshared.csv
            stage15-results/**
          if-no-files-found: warn

  wine-faults-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TABFORGE_WINE: ${{ github.workspace }}/wine/bin/wine
      TABFORGE_TFVST32_EXE: ${{ github.workspace }}/src/TabForge.AudioEngine/native/tfvst32.exe
      TABFORGE_TFVST64_EXE: ${{ github.workspace }}/src/TabForge.AudioEngine/native/tfvst64.exe
      TABFORGE_TFVST32_TEST_DLL: ${{ github.workspace }}/native/tfvst32/test-bin-linux/passthrough32.dll
      TABFORGE_TFVST64_TEST_DLL: ${{ github.workspace }}/native/tfvst32/test-bin-linux/passthrough64.dll
      TABFORGE_STAGE15_PROBE: ${{ github.workspace }}/stage15-probe/Stage15Probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Install cross compilers and display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mingw-w64 unzip libfreetype6 libfontconfig1

      - name: Fetch the pinned Wine tree
        run: |
          curl -fsSL -o wine.tar.xz "$WINE_TARBALL"
          echo "$WINE_TARBALL_SHA256  wine.tar.xz" | sha256sum -c -
          mkdir wine && tar -xf wine.tar.xz -C wine --strip-components=1
          chmod +x wine/bin/wine wine/bin/wineserver

      - name: Build the deterministic 32-bit and 64-bit test DLLs
        run: |
          mkdir -p native/tfvst32/test-bin-linux
          i686-w64-mingw32-g++ -std=c++17 -O2 -shared -static-libgcc -static-libstdc++ \
            -DUNICODE -D_UNICODE -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D_CRT_SECURE_NO_WARNINGS \
            -Wl,--no-insert-timestamp native/tfvst32/test/passthrough32.cpp \
            -o native/tfvst32/test-bin-linux/passthrough32.dll -luser32 -lgdi32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared -static-libgcc -static-libstdc++ \
            -DUNICODE -D_UNICODE -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D_CRT_SECURE_NO_WARNINGS \
            -Wl,--no-insert-timestamp native/tfvst32/test/passthrough32.cpp \
            -o native/tfvst32/test-bin-linux/passthrough64.dll -luser32 -lgdi32
          i686-w64-mingw32-objdump -p native/tfvst32/test-bin-linux/passthrough32.dll | grep -q VSTPluginMain
          x86_64-w64-mingw32-objdump -p native/tfvst32/test-bin-linux/passthrough64.dll | grep -q VSTPluginMain

      - name: Build the two-process prefix probe (test-only)
        run: |
          dotnet build tests/Stage15Probe/Stage15Probe.csproj -c Release -p:RestoreLockedMode=false -p:UseArtifactsOutput=false -o stage15-probe
          test -x stage15-probe/Stage15Probe

      - name: Create a tiny real tmpfs for the full-disk faults
        run: |
          sudo mkdir -p /mnt/tf-stage15
          sudo mount -t tmpfs -o size=1m,uid=$(id -u),gid=$(id -g),mode=0700 tmpfs /mnt/tf-stage15
          df -B1 --output=size /mnt/tf-stage15
          echo "TABFORGE_TEST_FULL_DISK=/mnt/tf-stage15" >> "$GITHUB_ENV"

      - name: Faults under Wine and on the full tmpfs
        run: |
          xvfb-run -a dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release \
            -p:RestoreLockedMode=false \
            --filter "FullyQualifiedName~Stage15FaultTests|FullyQualifiedName~Stage15WineTests|FullyQualifiedName~WineRuntimeLinuxTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=stage15-faults-wine.trx" \
            --results-directory "${{ github.workspace }}/stage15-results"

      - name: Load under Wine, all logical processors, chains of eight mixed 32/64-bit plug-ins
        env:
          TABFORGE_STRESS: '1'
          TABFORGE_LOAD_WARM_SECONDS: '2'
          TABFORGE_LOAD_SECONDS: '8'
          TABFORGE_LOAD_OUT: ${{ github.workspace }}/stage15-load-wine.csv
        run: |
          xvfb-run -a dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release \
            -p:RestoreLockedMode=false \
            --filter "FullyQualifiedName~Stage15StressTests.AllCore" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=stage15-load-wine.trx" \
            --results-directory "${{ github.workspace }}/stage15-results"

      - name: Remove the test tmpfs
        if: always()
        run: |
          sudo umount /mnt/tf-stage15 || true
          sudo rmdir /mnt/tf-stage15 || true

      - name: Upload Wine logs and data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage15-wine-evidence
          path: |
            stage15-load-wine.csv
            stage15-results/**
          if-no-files-found: warn
