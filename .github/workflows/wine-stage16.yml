name: wine-stage16
# Stage 16: audio accuracy. Windows renders the same input bridged (helper) and native where a
# native route exists and compares sample by sample (tolerance from data); latency compensation
# reported by bridged plug-ins (TDR Nova 184 samples) and offline==realtime are verified; Linux
# runs the same bridged measurements under Wine for comparison. TDR SlickEQ's offline difference
# is probed with the fresh-pair + repeat control (matrix check-9 shape). Test-only: downloads go
# to the runner cache, never committed, never uploaded. This workflow is dispatch-only: it starts
# real helper processes and downloads the makers' free archives.
on:
  workflow_dispatch:
  # Temporary registration trigger (Stages 14/15 did the same): a workflow that only exists on
  # wine-bridge is not dispatchable until GitHub has seen it on a push. Removed once the gate runs
  # are recorded.
  push:
    branches: [wine-bridge]
    paths:
      - '.github/workflows/wine-stage16.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  WINE_TARBALL: https://github.com/Kron4ek/Wine-Builds/releases/download/9.21/wine-9.21-amd64-wow64.tar.xz
  WINE_TARBALL_SHA256: 020f8886750ff658d92ea39e696d2a57d3e8f056f00d8dfe45b65cddee5d6fa5
  NOVA_URL: https://www.tokyodawn.net/labs/Nova/2.2.3/TDR%20Nova%20(no%20installer).zip
  NOVA_SHA256: 9bb52d042bd95dd85456da66316347a00d865d9d3f6652333e1a2bc195cb8907
  SLICKEQ_URL: https://www.tokyodawn.net/labs/SlickEQ/1.3.9/TDR%20VOS%20SlickEQ%20(no%20installer).zip
  SLICKEQ_SHA256: b005f5899dfe928b549c7d2b7c3acb0d7b45e72a2e6a784bf6c269f8ea0d2d4b

jobs:
  windows-accuracy:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Build the x86 and x64 helpers and test plug-ins
        shell: pwsh
        run: |
          cmake -S native/tfvst32 -B build/win32 -G "Visual Studio 17 2022" -A Win32 -DTFVST32_BUILD_TEST=ON
          cmake --build build/win32 --config Release --parallel
          cmake -S native/tfvst32 -B build/win64 -G "Visual Studio 17 2022" -A x64 -DTFVST32_BUILD_TEST=ON
          cmake --build build/win64 --config Release --parallel
          # The helpers load the VST3 shim from their own folder (vst3_host.cpp EnsureShim);
          # the shims are checked in under src/TabForge.AudioEngine/native, so stage them next
          # to the freshly built helpers or every VST3 test fails with "shim is missing".
          Copy-Item src/TabForge.AudioEngine/native/tfvst3.dll build/win64/Release/tfvst3.dll -Force
          Copy-Item src/TabForge.AudioEngine/native/tfvst3-x86.dll build/win32/Release/tfvst3-x86.dll -Force

      - name: Download the TDR Nova and SlickEQ archives (maker pages, SHA-pinned)
        shell: pwsh
        run: |
          $dl = Join-Path $env:RUNNER_TEMP 'stage16-dl'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          Invoke-WebRequest -Uri $env:NOVA_URL -OutFile (Join-Path $dl 'nova.zip')
          if ((Get-FileHash (Join-Path $dl 'nova.zip') -Algorithm SHA256).Hash -ne $env:NOVA_SHA256) { throw 'Nova SHA-256 mismatch' }
          Invoke-WebRequest -Uri $env:SLICKEQ_URL -OutFile (Join-Path $dl 'slickeq.zip')
          if ((Get-FileHash (Join-Path $dl 'slickeq.zip') -Algorithm SHA256).Hash -ne $env:SLICKEQ_SHA256) { throw 'SlickEQ SHA-256 mismatch' }
          Expand-Archive -Path (Join-Path $dl 'nova.zip') -DestinationPath (Join-Path $dl 'nova')
          Expand-Archive -Path (Join-Path $dl 'slickeq.zip') -DestinationPath (Join-Path $dl 'slickeq')
          "TABFORGE_STAGE16_NOVA_VST2_32=$(Join-Path $dl 'nova\TDR Nova (no installer)\VST2\Win32\TDR Nova.dll')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TABFORGE_WINE_REAL_VST3_32=$(Join-Path $dl 'nova\TDR Nova (no installer)\VST3\Win32\TDR Nova.vst3')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TABFORGE_STAGE16_SLICKEQ_VST2=$(Join-Path $dl 'slickeq\TDR VOS SlickEQ (no installer)\VST2\x64\TDR VOS SlickEQ.dll')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TABFORGE_STAGE16_SLICKEQ_VST3=$(Join-Path $dl 'slickeq\TDR VOS SlickEQ (no installer)\VST3\x64\TDR VOS SlickEQ.vst3')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage 16 audio accuracy (bridged vs native, latency/PDC, offline, SlickEQ probe)
        shell: pwsh
        env:
          TABFORGE_TFVST32_EXE: ${{ github.workspace }}\build\win32\Release\tfvst32.exe
          TABFORGE_TFVST64_EXE: ${{ github.workspace }}\build\win64\Release\tfvst64.exe
          TABFORGE_TFVST32_TEST_DLL: ${{ github.workspace }}\build\win32\Release\passthrough32.dll
          TABFORGE_TFVST64_TEST_DLL: ${{ github.workspace }}\build\win64\Release\passthrough64.dll
        run: >
          dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release -p:RestoreLockedMode=false
          --filter "FullyQualifiedName~Stage16"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=stage16-windows.trx"
          --results-directory "${{ github.workspace }}\stage16-results"

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage16-windows-evidence
          path: stage16-results/**
          if-no-files-found: warn

  wine-accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TABFORGE_WINE: ${{ github.workspace }}/wine/bin/wine
      TABFORGE_TFVST32_EXE: ${{ github.workspace }}/src/TabForge.AudioEngine/native/tfvst32.exe
      TABFORGE_TFVST64_EXE: ${{ github.workspace }}/src/TabForge.AudioEngine/native/tfvst64.exe
      TABFORGE_TFVST32_TEST_DLL: ${{ github.workspace }}/native/tfvst32/test-bin-linux/passthrough32.dll
      TABFORGE_TFVST64_TEST_DLL: ${{ github.workspace }}/native/tfvst32/test-bin-linux/passthrough64.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Install cross compilers and display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mingw-w64 unzip libfreetype6 libfontconfig1

      - name: Fetch the pinned Wine tree
        run: |
          curl -fsSL -o wine.tar.xz "$WINE_TARBALL"
          echo "$WINE_TARBALL_SHA256  wine.tar.xz" | sha256sum -c -
          mkdir wine && tar -xf wine.tar.xz -C wine --strip-components=1
          chmod +x wine/bin/wine wine/bin/wineserver

      - name: Build the deterministic 32-bit and 64-bit test DLLs
        run: |
          mkdir -p native/tfvst32/test-bin-linux
          i686-w64-mingw32-g++ -std=c++17 -O2 -shared -static-libgcc -static-libstdc++ \
            -DUNICODE -D_UNICODE -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D_CRT_SECURE_NO_WARNINGS \
            -Wl,--no-insert-timestamp native/tfvst32/test/passthrough32.cpp \
            -o native/tfvst32/test-bin-linux/passthrough32.dll -luser32 -lgdi32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared -static-libgcc -static-libstdc++ \
            -DUNICODE -D_UNICODE -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D_CRT_SECURE_NO_WARNINGS \
            -Wl,--no-insert-timestamp native/tfvst32/test/passthrough32.cpp \
            -o native/tfvst32/test-bin-linux/passthrough64.dll -luser32 -lgdi32
          i686-w64-mingw32-objdump -p native/tfvst32/test-bin-linux/passthrough32.dll | grep -q VSTPluginMain
          x86_64-w64-mingw32-objdump -p native/tfvst32/test-bin-linux/passthrough64.dll | grep -q VSTPluginMain

      - name: Download the TDR Nova and SlickEQ archives (maker pages, SHA-pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/stage16-dl"
          curl -fsSL -o "$RUNNER_TEMP/stage16-dl/nova.zip" "$NOVA_URL"
          echo "$NOVA_SHA256  $RUNNER_TEMP/stage16-dl/nova.zip" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/stage16-dl/slickeq.zip" "$SLICKEQ_URL"
          echo "$SLICKEQ_SHA256  $RUNNER_TEMP/stage16-dl/slickeq.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/stage16-dl/nova.zip" -d "$RUNNER_TEMP/stage16-dl/nova"
          unzip -q -o "$RUNNER_TEMP/stage16-dl/slickeq.zip" -d "$RUNNER_TEMP/stage16-dl/slickeq"
          echo "TABFORGE_WINE_REAL_VST3_32=$RUNNER_TEMP/stage16-dl/nova/TDR Nova (no installer)/VST3/Win32/TDR Nova.vst3" >> "$GITHUB_ENV"
          echo "TABFORGE_STAGE16_SLICKEQ_VST2=$RUNNER_TEMP/stage16-dl/slickeq/TDR VOS SlickEQ (no installer)/VST2/x64/TDR VOS SlickEQ.dll" >> "$GITHUB_ENV"

      - name: Stage 16 audio accuracy under Wine (bridged numbers for the Windows comparison)
        run: |
          xvfb-run -a dotnet test tests/TabForge.Avalonia.Tests/TabForge.Avalonia.Tests.csproj -c Release \
            -p:RestoreLockedMode=false \
            --filter "FullyQualifiedName~Stage16" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=stage16-wine.trx" \
            --results-directory "${{ github.workspace }}/stage16-results"

      - name: Upload Wine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage16-wine-evidence
          path: stage16-results/**
          if-no-files-found: warn
