name: wine-spike
# DEPRECATED (Stage 2 feasibility only): use wine-stage2.yml for the pinned, checked Wine gate. This workflow is kept for
# history; it only prints the tarball checksum and is never part of a release gate. Manual, non-shipping.
# Stage 2 feasibility: does the shipped 32-bit helper run under Wine WoW64 on Linux? Non-shipping, manual.
on:
  workflow_dispatch:
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned WoW64 Wine (spike only, not for release)
        run: |
          curl -fsSL -o wine.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/9.21/wine-9.21-amd64-wow64.tar.xz
          sha256sum wine.tar.xz
          mkdir wine && tar -xf wine.tar.xz -C wine --strip-components=1
          sudo apt-get update && sudo apt-get install -y xvfb libfreetype6 libfontconfig1
      - name: Prefix and helper selftest
        env:
          WINEPREFIX: ${{ runner.temp }}/prefix
          WINEDLLOVERRIDES: mscoree,mshtml=
          WINEDEBUG: -all
        run: |
          W="$PWD/wine/bin/wine"
          "$W" --version
          xvfb-run -a timeout 180 "$W" wineboot -u; echo "wineboot exit $?"
          file src/TabForge.AudioEngine/native/tfvst32.exe
          xvfb-run -a timeout 60 "$W" src/TabForge.AudioEngine/native/tfvst32.exe --selftest 2>&1 | tee selftest.txt
          echo "selftest exit ${PIPESTATUS[0]}"
          grep -q 'selftest: ok' selftest.txt
