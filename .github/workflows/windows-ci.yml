name: windows-ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # The full suite (tests/full-suite) runs weekly and on manual dispatch; pushes and pull requests run the basic set.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Restore (locked), Release build, and the headless self-test. Any self-test failure fails the job.
  build-and-selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # 'true' on the weekly schedule and manual dispatch: the full suite is compiled in and run.
      FULL_SUITE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # Run as on a clean checkout: the copyrighted sample songs in Tabs/ are not part of the repository, so every
      # check that needs them must skip (reported in the log), never fail.
      TABFORGE_NO_LOCAL_SONGS: '1'
      # Judge test windows against the runner's small screen (1024x728 at 100%) so the same check fails on a developer PC
      # with a big or high-DPI screen (docs/TESTING.md).
      TABFORGE_SELFTEST_SMALLSCREEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore TabForge.sln --locked-mode

      - name: Build (Release)
        # The full suite (tests/full-suite) is compiled in with TabForgeFullSuite only on schedule or dispatch.
        shell: pwsh
        run: |
          $full = if ($env:FULL_SUITE -eq 'true') { '-p:TabForgeFullSuite=true' } else { '-p:TabForgeFullSuite=false' }
          dotnet build TabForge.sln -c Release --no-restore $full

      - name: Self-test (headless)
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'selftest.log'
          $exe = Join-Path $PWD 'src/TabForge/bin/Release/net8.0-windows/TabForge.exe'
          # --require makes the source-hygiene and installer-parity checks fail instead of skipping when the source
          # tree or installer script cannot be found (the working directory is the repository root).
          # TabForge.exe is a WPF (GUI-subsystem) executable: start it and wait for it to exit. --selftest opens no
          # main window, needs no audio device (the engine tests use the headless harness and a null output).
          # The basic set (a normal build) requires only the groups it contains; the full suite requires every CI group.
          $testArgs = if ($env:FULL_SUITE -eq 'true') { @('--selftest', "`"$log`"", '--require', 'ci') }
            else { @('--selftest', "`"$log`"", '--areas', 'basic', '--require', 'source-hygiene,installer-parity,architecture') }
          $p = Start-Process -FilePath $exe -ArgumentList $testArgs -Wait -PassThru
          "self-test exit code: $($p.ExitCode)"
          if (-not (Test-Path -LiteralPath $log)) { Write-Error 'self-test log was not written'; exit 2 }
          Select-String -Path $log -Pattern '^\s+(SKIP|FAIL)\s|self-test:' | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (-not (Select-String -Path $log -Pattern '^TabForge self-test: \d+ passed, 0 failed' -Quiet)) {
            Write-Error 'self-test log does not report 0 failed'; exit 1
          }

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-log
          path: selftest.log
          if-no-files-found: warn

  # Builds native/tfvst3 from the pinned Steinberg VST3 SDK and compares it with the checked-in DLL.
  # The rebuild is never byte-identical (link timestamps, PDB identity, source-path hash names; native/tfvst3/BUILD.md,
  # "Reproducibility"): tools/Compare-NativeBridge.ps1 explains those categories from the PE headers and fails only when
  # a difference falls outside them (different code, size, SDK or compiler). Releases do not depend on the match: they
  # ship the committed DLL, which the maintainer replaces with the build-bridge workflow's output whenever the bridge
  # changes (docs/REPRODUCIBLE_BUILDS.md).
  native-bridge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build tfvst3.dll from the pinned SDK
        shell: pwsh
        run: |
          # A short build folder: the SDK's submodules contain very long paths.
          cmake -S native/tfvst3 -B C:\tfb -A x64 -DTFVST3_BUILD_TEST=OFF
          cmake --build C:\tfb --config Release --parallel
          cmake --version | Select-Object -First 1
          Select-String -Path 'C:\tfb\CMakeFiles\*\CMakeCXXCompiler.cmake' -Pattern 'COMPILER_ID "|COMPILER_VERSION "' | ForEach-Object { $_.Line }

      # PE-aware: parses the headers, masks the link timestamps, the PDB identity and the source-path hash names in both
      # files, and requires everything else to be identical. Exits 1 when a difference falls outside those categories.
      - name: Compare with the checked-in DLL (PE-aware)
        shell: pwsh
        run: |
          # Strict only when this runner's compiler is the one that built the shipped DLL; a runner image update changes the
          # compiler, and then the comparison is reported as a warning until the bridge is rebuilt with build-bridge.yml.
          $recorded = (Select-String -Path native/BUILD_PROVENANCE.md -Pattern 'Compiler: MSVC (\S+)').Matches | Select-Object -First 1 | ForEach-Object { $_.Groups[1].Value }
          $current = (Select-String -Path 'C:\tfb\CMakeFiles\*\CMakeCXXCompiler.cmake' -Pattern 'CMAKE_CXX_COMPILER_VERSION "([^"]+)"' -ErrorAction SilentlyContinue).Matches | Select-Object -First 1 | ForEach-Object { $_.Groups[1].Value }
          Write-Output "Shipped bridge compiler: $recorded; this runner: $current"
          ./tools/Compare-NativeBridge.ps1 -Built 'C:\tfb\Release\tfvst3.dll' -Shipped 'src/TabForge.AudioEngine/native/tfvst3.dll' -SummaryPath $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
            if ($recorded -and $current -and $recorded -ne $current) {
              Write-Output "::warning::Bridge differs, but the runner compiler ($current) is not the one that built the shipped DLL ($recorded). Rebuild it with the build-bridge workflow."
              exit 0
            }
            exit $LASTEXITCODE
          }

      - name: Upload the built DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfvst3-ci-build
          path: C:\tfb\Release\tfvst3.dll
          if-no-files-found: warn

  # Fails when a referenced NuGet package (direct or transitive) has a known vulnerability.
  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore TabForge.sln --locked-mode

      - name: dotnet list package --vulnerable
        shell: pwsh
        run: |
          $out = dotnet list TabForge.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { Write-Error "dotnet list package failed ($LASTEXITCODE)"; exit 1 }
          if ($out -match 'has the following vulnerable packages') { Write-Error 'vulnerable packages found (see above)'; exit 1 }

  # TabForge.AlphaTab (alphaTab 1.8.4 plus four patches) is built from source and checked in as vendor/alphatab/*.nupkg. This rebuilds it
  # from the pinned upstream commit and the patch (github.com/CoderLine/alphaTab, npmjs.org, nuget.org) and fails when the rebuilt
  # DLL is not the one inside the committed package (vendor/alphatab/README.md).
  alphatab-reproducible:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Rebuild TabForge.AlphaTab and compare
        shell: pwsh
        run: |
          node --version
          ./tools/Build-AlphaTab.ps1 -Work (Join-Path $env:RUNNER_TEMP 'tabforge-alphatab-build')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
