<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="28" y1="4" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#162031"/>
      <stop offset="1" stop-color="#0A121F"/>
    </linearGradient>
    <linearGradient id="innerShade" x1="28" y1="6" x2="28" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="28" y1="20" x2="28" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF955C"/>
      <stop offset="1" stop-color="#E25D34"/>
    </linearGradient>
    <filter id="dropShadow" x="0" y="0" width="56" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="outerGlow" x="-20" y="-20" width="96" height="96" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.886 0 0 0 0 0.365 0 0 0 0 0.204 0 0 0 0.24 0"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <rect x="7" y="7" width="42" height="42" rx="10.5" fill="url(#bg)"/>
    <rect x="8" y="8" width="40" height="40" rx="9.7" fill="url(#innerShade)"/>
    <rect x="7.85" y="7.85" width="40.3" height="40.3" rx="10" stroke="#89A1C7" stroke-opacity="0.10"/>
  </g>

  <rect x="7" y="7" width="42" height="42" rx="10.5" fill="none" stroke="#E25D34" stroke-opacity="0.08" stroke-width="6" filter="url(#outerGlow)"/>
  <rect x="7.85" y="7.85" width="40.3" height="40.3" rx="10" fill="none" stroke="#E25D34" stroke-width="1.9"/>
  <rect x="11" y="11" width="34" height="34" rx="8.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>

  <rect x="21.5" y="21.5" width="13" height="13" rx="2.6" fill="url(#iconGrad)" opacity="1.0" transform="translate(0 1.5)"/>
</svg>